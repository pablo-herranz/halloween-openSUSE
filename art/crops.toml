# What every crop of a wallpaper master to another aspect ratio must show:
# `keep` is the box (x0, y0, x1, y1, as 0..1 of width and height) around the
# chameleon, its hat and the lanterns, with a little margin. A crop that can
# hold the box contains it and otherwise stays as close to the middle of the
# master as it can; a crop too small for it (portrait, 32:9) is centred on
# `focus` instead, between the chameleon's head and the lanterns.

[dusk]
keep = [0.615, 0.10, 0.965, 0.82]
focus = [0.80, 0.40]

[night]
keep = [0.615, 0.10, 0.965, 0.82]
focus = [0.80, 0.40]

# The splash backdrop: the calm left part of the night master (x0, y0, x1, y1),
# so the splash's own chameleon isn't doubled by the one in the wallpaper.
[splash]
box = [0.0, 0.2, 0.58, 0.785]

# The Firefox header: the night master drawn `width` px wide, cut at `right`
# (0..1 of its width) just past the jack-o'-lanterns, with `top` (0..1 of its
# height) at the top of the tab strip. A 44 px tab strip can only show a slice
# of the chameleon, so the band stops short of it.
[firefox]
width = 1320
right = 0.775
top = 0.584
