# Pull requests the repository owner or Dependabot opens from a branch of
# this repository are set to merge (rebased onto main) once main's required
# checks pass. Dependabot only proposes releases at least 7 days old (see
# dependabot.yml). Everyone else's pull requests wait for a maintainer.
# Drafts are left alone until they are marked ready. To keep one from
# merging: gh pr merge --disable-auto <number>
#
# GitHub merges these as github-actions, so the merge doesn't start a Check
# run on main. The pull request's run already checked the same tree: main's
# ruleset requires the branch to be up to date before it merges.
name: Auto-merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions: {}

jobs:
  enable:
    name: Enable auto-merge
    if: >-
      (github.event.pull_request.user.login == github.repository_owner
       || github.event.pull_request.user.login == 'dependabot[bot]')
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - run: gh pr merge --auto --rebase "$PR_URL"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
