# Every pull request and every push to main: lint, then build and validate
# everything. The CI job at the end is the check main's ruleset requires.
name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements*.txt
      # ruff, ShellCheck, actionlint, zizmor, typos, editorconfig-checker and
      # reuse lint. With a token, zizmor also runs its online audits.
      - run: make lint ZIZMOR_FLAGS=--format=github
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: Build and check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The art masters are in Git LFS. Cache them, keyed by the list of LFS
      # objects, so CI doesn't use up the repository's LFS bandwidth.
      - name: List LFS objects
        id: lfs
        run: echo "hash=$(git lfs ls-files --long | cut -d' ' -f1 | sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ steps.lfs.outputs.hash }}
      - run: git lfs pull
      # The Breeze SVGs the Plasma style is built from, pinned in tools/upstream.toml
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/cache
          key: breeze-${{ hashFiles('tools/upstream.toml') }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: make check
      - run: make icon-preview
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: halloween-openSUSE-build
          path: |
            build/user
            build/root
            build/firefox
            build/defaults
            build/MANIFEST.sha256
            build/icon-preview.png
          retention-days: 14

  # The one check main's ruleset requires: it passes only when every job above
  # passed, so adding a job never needs a ruleset change.
  ci:
    name: CI
    if: always()
    needs: [lint, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
