name: Bug report
description: Something looks wrong, doesn't install, or is still un-themed
labels: [bug]
body:
  - type: dropdown
    id: piece
    attributes:
      label: Which part?
      options:
        - Wallpaper
        - Plasma style or colours
        - Splash screen
        - Icons
        - Login screen (SDDM)
        - Boot splash (Plymouth)
        - Firefox theme
        - Install or uninstall scripts
        - Build tools
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: A screenshot helps a lot for anything visual.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      placeholder: |
        1. Run build/install/install-user.sh
        2. Open …
  - type: input
    id: versions
    attributes:
      label: openSUSE and Plasma versions
      placeholder: Tumbleweed 20261018, Plasma 6.8.2
  - type: textarea
    id: verify
    attributes:
      label: Output of build/install/verify.sh
      render: text
