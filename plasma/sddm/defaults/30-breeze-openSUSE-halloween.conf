# vendor defaults live: makes the Halloween login screen the default. It sorts
# after openSUSE's 20-breeze-openSUSE.conf, and the login screen an admin
# picks (System Settings writes /etc/sddm.conf.d/kde_settings.conf) still wins.
[Theme]
Current=breeze-openSUSE-halloween
